[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mz-giscup-26"
version = "0.1.0"
description = "Correctness-first solver scaffold for the ACM SIGSPATIAL 2026 GIS Cup antenna-placement challenge."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Marko Zlatic" }]
# Declared as a classifier rather than PEP 639 `license = "MIT"`, which would need
# setuptools>=77 in the build requirement. The bundle instructions tell an evaluator to
# `pip install -e .`; raising the build floor on submission day buys metadata polish at
# the cost of a way for that install to fail. See LICENSE for the actual grant.
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
  "shapely>=2.0",
  "geopandas>=0.14",
  "pyogrio>=0.7",
  "numpy>=2.0",   # np.bitwise_count
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
]
performance = [
  "numba>=0.59",
  "pyroaring>=1.0",
  "rtree>=1.2",
]

[project.scripts]
giscup = "giscup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
